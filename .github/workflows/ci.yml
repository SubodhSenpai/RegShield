name: CI

# Every push and pull request runs the test suite, the linters and a check of the
# built package. The last job, "CI passed", sums them up: it's the one check a
# branch ruleset needs to require.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run that's still going
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The test extra brings LangChain, LangGraph, smolagents and the OpenAI, Anthropic and
      # Gemini SDKs; the tests run real agents offline with scripted models, no API keys
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  package:
    name: Package (build, install, demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and source archive
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and run the demo
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          clean/bin/regshield demo --report demo-report.json
          clean/bin/python -c "import importlib.resources as r; p = r.files('regression_shield'); assert p.joinpath('static/index.html').is_file() and p.joinpath('data/pricing.json').is_file(); print('dashboard and price list are in the wheel')"

  ci-passed:
    name: CI passed
    if: always()
    needs: [tests, lint, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "Tests, lint and package all passed."
