name: RegressionShield SDK Verification

on:
  push:
    branches: [ main, SDK ]
  pull_request:
    branches: [ main, SDK ]

jobs:
  validate-sdk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Configure Runtime Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install SDK Package
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Run SDK & Agent Reasoning Test Suite
      run: |
        pytest -v tests/

    - name: Run CLI Evaluation on Sample Scenarios
      run: |
        regshield eval --file examples/sample_scenarios.json
