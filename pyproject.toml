[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-shield"
dynamic = ["version"]
description = "Regression tests for AI agent execution traces: tool use, ordering, loops, hallucinated success, and agentic patterns"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Subodh" }]
keywords = [
    "ai-agents",
    "agent-evaluation",
    "regression-testing",
    "llm",
    "tool-calling",
    "multi-agent",
    "langchain",
    "langgraph",
    "smolagents",
    "human-in-the-loop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# The callback handler only needs langchain-core, so it works with LangChain 0.3 and 1.x
langchain = ["langchain-core>=0.3.0"]
langgraph = ["langchain-core>=0.3.0", "langgraph>=0.3.0"]
smolagents = ["smolagents>=1.26.0"]
all = ["langchain-core>=0.3.0", "langgraph>=0.3.0", "smolagents>=1.26.0"]
# Everything the test suite needs, including the real framework integration tests
test = [
    "pytest>=8.0.0",
    "langchain>=1.0.0",
    "langgraph>=0.3.0",
    "langgraph-supervisor>=0.0.29",
    "smolagents>=1.26.0",
]
dev = ["regression-shield[test]", "ruff>=0.6.0", "mypy>=1.10.0", "build>=1.0.0"]

[project.urls]
Homepage = "https://github.com/SubodhSenpai/RegShield"
Repository = "https://github.com/SubodhSenpai/RegShield"
Documentation = "https://github.com/SubodhSenpai/RegShield/tree/main/docs"
Issues = "https://github.com/SubodhSenpai/RegShield/issues"

[project.scripts]
regshield = "regression_shield.cli:main"

[tool.setuptools.dynamic]
version = { attr = "regression_shield.__version__" }

[tool.setuptools.packages.find]
include = ["regression_shield*"]

[tool.setuptools.package-data]
regression_shield = ["static/*", "data/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["website", "venv", ".venv-test"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["regression_shield"]
check_untyped_defs = true
ignore_missing_imports = true
