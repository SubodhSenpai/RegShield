[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-shield"
version = "0.3.0"
description = "Observability and Evaluation SDK for Autonomous Agentic AI Reasoning Chains & Execution Trajectories"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Subodh" }
]
keywords = [
    "ai-agent",
    "agentic-ai",
    "evaluation",
    "observability",
    "trajectory",
    "react-loop",
    "function-calling",
    "llm-judge"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
smolagents = [
    "smolagents>=1.26.0",
]
all = [
    "smolagents>=1.26.0",
    "pytest>=8.0.0",
]

[project.scripts]
regshield = "regression_shield.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["regression_shield*"]

[tool.setuptools.package-data]
regression_shield = ["static/*"]
